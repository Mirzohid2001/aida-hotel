{% extends "base.html" %}
{% load i18n %}

{% block title %}{{ page.title }} — {{ site_settings.site_name }}{% endblock %}

{% block content %}
<section class="page-hero page-hero--compact">
  <div class="container">
    <span class="section-eyebrow">{% trans "Information" %}</span>
    <h1>{{ page.title }}</h1>
  </div>
</section>
<section class="section section--white reveal">
  <div class="container container--narrow">
    <article class="policy-content prose">{{ page.content|linebreaks }}</article>
  </div>
</section>
{% endblock %}
