{% load i18n money_tags %}
{% if total %}
<div class="price-summary-card">
  <h4>{% trans "Price Summary" %}</h4>
  <p>{% blocktrans with count=selected_count nights=nights %} {{ count }} room(s) × {{ nights }} night(s){% endblocktrans %}</p>
  <p class="price-total"><strong>{% trans "Total" %}:</strong> {{ total|money:site_settings.currency }}</p>
</div>
{% endif %}
